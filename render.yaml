services:
  - type: web
    name: pointage-system
    runtime: docker
    plan: standard
    region: oregon
    
    # Build configuration
    dockerfilePath: ./Dockerfile
    
    # Environment variables (set these in Render Dashboard)
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_HOST
        sync: false  # Set in Render environment
      - key: DATABASE_ROOT
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: SECRET_KEY
        sync: false  # Set a strong secret in Render environment
      - key: ALLOWED_ORIGINS
        value: "https://your-frontend-domain.com,https://www.your-frontend-domain.com"
      - key: PYTHONUNBUFFERED
        value: "1"
    
    # Health check
    healthCheckPath: /health
    
    # Build command (if needed)
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    
    # Start command
    startCommand: bash start.sh
    
    # Autoscaling (optional)
    autoDeploy: true
